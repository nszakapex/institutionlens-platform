# Phase 9 Supabase CLI configuration.
# `project_id` is a local CLI namespace, not a hosted Supabase project reference.
# Expose only institutionlens_api (narrow RPCs). Never expose the core institutionlens schema.
project_id = "institutionlens-platform"

[api]
enabled = true
schemas = ["public", "graphql_public", "institutionlens_api"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = []
