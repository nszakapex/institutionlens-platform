name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (offline after install)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      IL_APP_MODE: local-demo
      IL_DEMO_TENANT_ID: demo-tenant-local
      IL_DEMO_PRINCIPAL_ID: demo-principal-local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Asset scan
        run: npm run scan:assets

      - name: Secret scan
        run: npm run scan:secrets

      - name: Clean-room scan
        run: npm run scan:clean-room

      - name: Production build
        run: npm run build
